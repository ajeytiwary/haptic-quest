name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check festival.js
      - run: node --check backend.js
      - run: node --check organizer.js
      - run: node --check config.js
      - run: node --check sw.js
      - name: Validate privacy guard
        run: grep -q "metadata ?|" supabase/schema.sql && grep -q "postgis" supabase/schema.sql
      - name: Validate production functions
        run: test -s supabase/functions/verify-checkpoint/index.ts && test -s supabase/functions/claim-reward/index.ts && test -s supabase/functions/organizer-dashboard/index.ts
      - name: Install native dependencies
        working-directory: native
        run: npm install --ignore-scripts
      - name: Typecheck native client
        working-directory: native
        run: npm run typecheck
      - run: test -s index.html && test -s organizer.html && test -s manifest.json && test -s styles.css && test -s supabase/schema.sql
      - name: Reject browser secrets
        run: "! grep -R -E 'service_role|SUPABASE_SERVICE_ROLE_KEY' --include='*.js' --include='*.html' ."
