<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Haptic Quest Organizer</title></head><body><main><div class="eyebrow">Haptic Quest</div><h1>Quest builder</h1><p class="muted">Pilot editor: build and export a festival configuration. Production publishing must require authenticated organizer access.</p><section class="card"><label>Festival name<input id="name" value="GLOW Eindhoven 2026"></label><label>Theme<input id="theme" value="CONNECT"></label><label>City<input id="city" value="Eindhoven"></label></section><section class="card"><h2>Checkpoint</h2><label>Name<input id="cpname" placeholder="Installation name"></label><label>Place<input id="place" placeholder="Venue / area"></label><div class="row"><label>Latitude<input id="lat" type="number" step="any"></label><label>Longitude<input id="lon" type="number" step="any"></label></div><label>Clue<input id="clue" placeholder="Haptic quest clue"></label><label>XP<input id="xp" type="number" value="100"></label><button class="btn" id="add">Add checkpoint</button></section><section class="card"><h2>Draft</h2><div id="list"></div><button class="btn alt" id="export">Export JSON</button></section><pre id="output" class="codebox"></pre></main><script src="organizer.js"></script></body></html>
